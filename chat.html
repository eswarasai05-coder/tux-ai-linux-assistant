<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TUX-AI Chat</title>
</head>

<body style="background:#05070d;color:white;font-family:Arial;text-align:center;padding:60px 20px;">

  <h1 style="color:#00e5ff;">🤖 TUX-AI Chat</h1>

  <p style="color:#9aa8b8;">
    TUX-AI Chat is working!
  </p>

  <br>

  <input
    id="message"
    type="text"
    placeholder="Ask something..."
    style="padding:15px;width:80%;max-width:500px;"
  >

  <button
    onclick="reply()"
    style="padding:15px;background:#00e5ff;border:0;"
  >
    Send
  </button>

  <p id="answer" style="margin-top:30px;color:#00e5ff;"></p>

  <br>

  <a href="index.html" style="color:#00e5ff;">
    ← Back to Home
  </a>

  <script>
    function reply() {
      const message = document.getElementById("message").value;
      const answer = document.getElementById("answer");

      if (message.trim() === "") {
        answer.textContent = "Please type something.";
        return;
      }

      answer.textContent =
        "TUX-AI: I received your question — " + message;
    }
  </script>

</body>
</html>
