<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TUX-AI Chat</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #05070d;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100vh;
    }

    header {
      padding: 18px 7%;
      border-bottom: 1px solid #172536;
      background: #080c14;
    }

    .logo {
      color: #00e5ff;
      font-size: 24px;
      font-weight: bold;
    }

    .logo span {
      color: white;
    }

    .chat-container {
      max-width: 900px;
      margin: 50px auto;
      padding: 0 20px;
    }

    h1 {
      text-align: center;
      font-size: 42px;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #8f9bae;
      margin-bottom: 35px;
    }

    .chat-box {
      height: 450px;
      background: #080d16;
      border: 1px solid #1b3042;
      border-radius: 18px;
      padding: 25px;
      overflow-y: auto;
    }

    .message {
      margin-bottom: 20px;
      padding: 15px;
      border-radius: 12px;
      max-width: 80%;
    }

    .ai {
      background: #0d1723;
      border-left: 3px solid #00e5ff;
    }

    .user {
      background: #10202a;
      margin-left: auto;
      border-right: 3px solid #00e5ff;
    }

    .label {
      color: #00e5ff;
      font-size: 13px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    .input-area {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    input {
      flex: 1;
      padding: 15px;
      border-radius: 10px;
      border: 1px solid #26384a;
      background: #080d16;
      color: white;
      outline: none;
      font-size: 15px;
    }

    input:focus {
      border-color: #00e5ff;
    }

    button {
      padding: 15px 25px;
      border: none;
      border-radius: 10px;
      background: #00d9ff;
      color: #031018;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #48e7ff;
    }

    .back {
      display: block;
      width: fit-content;
      margin: 25px auto;
      color: #00e5ff;
      text-decoration: none;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 32px;
      }

      .chat-box {
        height: 400px;
      }

      .input-area {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">TUX<span>-AI</span></div>
  </header>

  <main class="chat-container">

    <h1>🤖 TUX-AI Chat</h1>

    <p class="subtitle">
      Your Linux & Cybersecurity learning assistant
    </p>

    <div class="chat-box" id="chatBox">

      <div class="message ai">
        <div class="label">TUX-AI</div>
        Hello! I'm TUX-AI. Ask me about Linux, networking,
        commands, cybersecurity concepts, or troubleshooting.
      </div>

    </div>

    <div class="input-area">

      <input
        type="text"
        id="userInput"
        placeholder="Ask TUX-AI something..."
        onkeydown="handleEnter(event)"
      >

      <button onclick="sendMessage()">
        Send
      </button>

    </div>

    <a class="back" href="index.html">
      ← Back to Home
    </a>

  </main>

  <script>

    function sendMessage() {

      const input = document.getElementById("userInput");
      const chatBox = document.getElementById("chatBox");

      const message = input.value.trim();

      if (message === "") {
        return;
      }

      const userMessage = document.createElement("div");

      userMessage.className = "message user";

      userMessage.innerHTML = `
        <div class="label">You</div>
        ${escapeHTML(message)}
      `;

      chatBox.appendChild(userMessage);

      input.value = "";

      const aiMessage = document.createElement("div");

      aiMessage.className = "message ai";

      aiMessage.innerHTML = `
        <div class="label">TUX-AI</div>
        I'm currently running in demo mode. The AI backend
        will be connected in the next stage.
      `;

      chatBox.appendChild(aiMessage);

      chatBox.scrollTop = chatBox.scrollHeight;
    }


    function handleEnter(event) {

      if (event.key === "Enter") {
        sendMessage();
      }

    }


    function escapeHTML(text) {

      const div = document.createElement("div");

      div.textContent = text;

      return div.innerHTML;
    }

  </script>

</body>
</html>
