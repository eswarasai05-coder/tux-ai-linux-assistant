<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TUX-AI | Linux & Cybersecurity AI Assistant</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #05070d;
      color: #ffffff;
      line-height: 1.6;
    }

    /* NAVBAR */

    nav {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 1000;

      display: flex;
      justify-content: space-between;
      align-items: center;

      padding: 18px 7%;

      background: rgba(5, 7, 13, 0.92);
      border-bottom: 1px solid #142233;
      backdrop-filter: blur(12px);
    }

    .logo {
      font-size: 25px;
      font-weight: bold;
      color: #00e5ff;
    }

    .logo span {
      color: white;
    }

    nav ul {
      display: flex;
      list-style: none;
      gap: 30px;
    }

    nav ul li a {
      color: #b9c4d2;
      text-decoration: none;
      font-size: 15px;
      transition: 0.3s;
    }

    nav ul li a:hover {
      color: #00e5ff;
    }

    /* HERO */

    .hero {
      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      text-align: center;

      padding: 120px 7% 80px;

      background:
        radial-gradient(circle at 50% 30%, #073044 0%, #05070d 45%);
    }

    .hero-content {
      max-width: 900px;
    }

    .badge {
      display: inline-block;

      padding: 8px 16px;

      border: 1px solid #00e5ff;
      border-radius: 30px;

      color: #00e5ff;
      font-size: 13px;

      margin-bottom: 25px;
    }

    .hero h1 {
      font-size: 65px;
      margin-bottom: 20px;
      letter-spacing: -2px;
    }

    .hero h1 span {
      color: #00e5ff;
    }

    .hero p {
      max-width: 700px;
      margin: auto;

      color: #9aa8b8;
      font-size: 18px;
    }

    /* BUTTONS */

    .buttons {
      display: flex;
      justify-content: center;
      gap: 15px;

      margin-top: 35px;
    }

    .btn {
      display: inline-block;

      padding: 14px 25px;

      border-radius: 10px;

      text-decoration: none;
      font-weight: bold;

      transition: 0.3s;
    }

    .primary {
      background: #00e5ff;
      color: #031018;
    }

    .primary:hover {
      background: #53edff;
      transform: translateY(-2px);
    }

    .secondary {
      border: 1px solid #26394c;
      color: white;
      background: #0a111b;
    }

    .secondary:hover {
      border-color: #00e5ff;
      color: #00e5ff;
      transform: translateY(-2px);
    }

    /* SECTIONS */

    section {
      padding: 90px 7%;
    }

    .section-title {
      text-align: center;
      margin-bottom: 50px;
    }

    .section-title h2 {
      font-size: 40px;
      margin-bottom: 10px;
    }

    .section-title p {
      color: #8d9aaa;
    }

    /* FEATURES */

    .features {
      background: #070a11;
    }

    .feature-grid {
      max-width: 1100px;
      margin: auto;

      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .card {
      padding: 28px;

      background: #0a1019;

      border: 1px solid #17283a;
      border-radius: 16px;

      transition: 0.3s;
    }

    .card:hover {
      transform: translateY(-5px);
      border-color: #00e5ff;
    }

    .icon {
      font-size: 32px;
      margin-bottom: 15px;
    }

    .card h3 {
      margin-bottom: 10px;
    }

    .card p {
      color: #8d9aaa;
      font-size: 14px;
    }

    /* TERMINAL */

    .terminal-section {
      background: #05070d;
    }

    .terminal {
      max-width: 850px;
      margin: auto;

      background: #020409;

      border: 1px solid #193044;
      border-radius: 15px;

      overflow: hidden;

      box-shadow: 0 0 40px rgba(0, 229, 255, 0.08);
    }

    .terminal-top {
      padding: 12px 18px;

      background: #0b111b;

      color: #647386;
      font-size: 13px;
    }

    .terminal-body {
      padding: 25px;

      font-family: monospace;
      color: #00e5ff;

      min-height: 220px;
    }

    .terminal-body span {
      color: #75ff9a;
    }

    /* ABOUT */

    .about {
      background: #070a11;
      text-align: center;
    }

    .about-content {
      max-width: 800px;
      margin: auto;
    }

    .about-content p {
      color: #9aa8b8;
      font-size: 17px;
    }

    /* CTA */

    .cta {
      text-align: center;

      background:
        radial-gradient(circle at center, #073044 0%, #05070d 60%);
    }

    .cta h2 {
      font-size: 42px;
      margin-bottom: 15px;
    }
