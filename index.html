<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TUX-AI Linux Assistant</title>
  <meta name="description" content="TUX-AI Linux & Cybersecurity AI Assistant">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #05070d;
      color: #f4f7ff;
      line-height: 1.6;
    }

    /* NAVBAR */

    nav {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 1000;
      padding: 16px 7%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(5, 7, 13, 0.85);
      backdrop-filter: blur(15px);
      border-bottom: 1px solid rgba(0, 220, 255, 0.15);
    }

    .logo {
      font-size: 23px;
      font-weight: bold;
      color: #00e5ff;
      letter-spacing: 1px;
    }

    .logo span {
      color: white;
    }

    nav ul {
      display: flex;
      list-style: none;
      gap: 28px;
    }

    nav a {
      color: #b9c4d6;
      text-decoration: none;
      font-size: 14px;
      transition: 0.3s;
    }

    nav a:hover {
      color: #00e5ff;
    }

    /* HERO */

    .hero {
      min-height: 100vh;
      padding: 150px 7% 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .hero::before {
      content: "";
      position: absolute;
      width: 500px;
      height: 500px;
      background: rgba(0, 200, 255, 0.12);
      filter: blur(120px);
      border-radius: 50%;
      top: 5%;
      left: 50%;
      transform: translateX(-50%);
    }

    .hero-content {
      max-width: 900px;
      position: relative;
      z-index: 2;
    }

    .badge {
      display: inline-block;
      padding: 8px 16px;
      border: 1px solid rgba(0, 229, 255, 0.4);
      border-radius: 30px;
      color: #00e5ff;
      background: rgba(0, 229, 255, 0.06);
      font-size: 13px;
      margin-bottom: 25px;
    }

    .hero h1 {
      font-size: clamp(42px, 8vw, 82px);
      line-height: 1.05;
      margin-bottom: 25px;
    }

    .hero h1 span {
      color: #00e5ff;
      text-shadow: 0 0 30px rgba(0, 229, 255, 0.3);
    }

    .hero p {
      color: #aab5c7;
      max-width: 700px;
      margin: auto;
      font-size: 18px;
    }

    .buttons {
      margin-top: 35px;
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-block;
      padding: 13px 25px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: bold;
      transition: 0.3s;
    }

    .primary {
      background: #00d9ff;
      color: #031018;
      box-shadow: 0 0 25px rgba(0, 217, 255, 0.2);
    }

    .primary:hover {
      transform: translateY(-3px);
      box-shadow: 0 0 35px rgba(0, 217, 255, 0.4);
    }

    .secondary {
      border: 1px solid #26384a;
      color: white;
      background: #0a0e17;
    }

    .secondary:hover {
      border-color: #00e5ff;
      color: #00e5ff;
    }

    /* SECTIONS */

    section {
      padding: 90px 7%;
    }

    .section-title {
      text-align: center;
      margin-bottom: 50px;
    }

    .section-title h2 {
      font-size: 38px;
      margin-bottom: 10px;
    }

    .section-title p {
      color: #8e9bae;
    }

    /* FEATURES */

    .features {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .card {
      padding: 28px;
      border-radius: 18px;
      background: rgba(12, 18, 29, 0.8);
      border: 1px solid #172536;
      transition: 0.3s;
    }

    .card:hover {
      transform: translateY(-7px);
      border-color: rgba(0, 229, 255, 0.5);
      box-shadow: 0 15px 45px rgba(0, 0, 0, 0.3);
    }

    .icon {
      font-size: 34px;
      margin-bottom: 15px;
    }

    .card h3 {
      margin-bottom: 10px;
      font-size: 20px;
    }

    .card p {
      color: #8f9bae;
      font-size: 14px;
    }

    /* TERMINAL */

    .terminal-section {
      background: #070a11;
    }

    .terminal {
      max-width: 850px;
      margin: auto;
      background: #020407;
      border: 1px solid #1d3040;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.35);
    }
